<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-label="CONTRACTOR Z — FRONT HANDOVER & CYCLE TIME cycle time and handover analysis">
  <style>
    .bg{fill:#F8F5EE}.navy{fill:#172A3A}.copper{fill:#A65332}.forest{fill:#304936}
