    .metricLabel{font:700 11px Arial,sans-serif;letter-spacing:1.6px;fill:#7b858d}.row{font:600 13px Arial,sans-serif;fill:#172A3A}
    .track{stroke:#D8D3C9;stroke-width:1}.current{fill:#A65332}.focused{fill:#304936}
    .ct{font:600 12px Arial,sans-serif;fill:#7b858d}.strong{fill:#304936}.legend{font:600 11px Arial,sans-serif;fill:#5c6871}
